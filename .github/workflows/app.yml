name: App checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: app-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: Tauri Rust and frontend checks
    runs-on: ubuntu-24.04
    steps:
      - name: Check out GetNative-VF
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            file \
            wget \
            libssl-dev \
            libxdo-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libjavascriptcoregtk-4.1-dev \
            libsoup-3.0-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Rust tests
        run: cargo test --manifest-path app/src-tauri/Cargo.toml

      - name: Install frontend dependencies
        working-directory: app
        run: npm ci

      - name: Frontend typecheck and build
        working-directory: app
        run: npm run build

      - name: Frontend lint (when configured)
        working-directory: app
        run: npm run lint --if-present
