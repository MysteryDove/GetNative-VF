name: Engine macOS

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: engine-macos-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos-arm64-metal:
    name: macos-15 arm64 Metal
    runs-on: macos-15
    steps:
      - name: Check out GetNative-VF
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Verify runner architecture
        run: test "$(uname -m)" = arm64

      - name: Ensure Xcode MetalToolchain is installed
        shell: bash
        run: |
          set -euo pipefail
          component_json="$(mktemp)"
          trap 'rm -f "$component_json"' EXIT
          xcodebuild -showComponent MetalToolchain -json > "$component_json"
          metal_status="$(plutil -extract status raw -o - "$component_json")"
          if [[ "$metal_status" != "installed" ]]; then
            xcodebuild -downloadComponent MetalToolchain
          fi
          xcodebuild -showComponent MetalToolchain -json > "$component_json"
          test "$(plutil -extract status raw -o - "$component_json")" = installed
          xcrun --find metal
          xcrun --find metallib

      - name: Configure CPU-only (no SDK lookup regression)
        run: >-
          cmake -S engine -B build/engine-macos-cpu
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_OSX_ARCHITECTURES=arm64
          -DGETNATIVE_ENABLE_METAL=OFF
          -DGETNATIVE_ENABLE_VULKAN=OFF
          -DBUILD_TESTING=ON

      - name: Configure
        run: >-
          cmake -S engine -B build/engine-macos
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_OSX_ARCHITECTURES=arm64
          -DGETNATIVE_ENABLE_METAL=ON
          -DGETNATIVE_ENABLE_VULKAN=OFF
          -DBUILD_TESTING=ON

      - name: Build
        run: cmake --build build/engine-macos --parallel

      - name: Test core, geometry, SIMD, planner, benchmark support, CLI, and Metal
        run: ctest --test-dir build/engine-macos --output-on-failure

  macos-arm64-upstream-conformance:
    name: macos-15 arm64 upstream conformance
    runs-on: macos-15
    steps:
      - name: Check out GetNative-VF
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Check out pinned descale reference
        uses: actions/checkout@v4
        with:
          repository: Irrational-Encoding-Wizardry/descale
          ref: 8c53f5d1297dee286e5a854ae5731103614a0583
          path: upstream/descale
          persist-credentials: false

      - name: Check out pinned zimg reference
        uses: actions/checkout@v4
        with:
          repository: sekrit-twc/zimg
          ref: 1ad1895d5ff0bbe69c61243f9996aede713d1b5f
          path: upstream/zimg
          persist-credentials: false

      - name: Ensure Xcode MetalToolchain is installed
        shell: bash
        run: |
          set -euo pipefail
          component_json="$(mktemp)"
          trap 'rm -f "$component_json"' EXIT
          xcodebuild -showComponent MetalToolchain -json > "$component_json"
          metal_status="$(plutil -extract status raw -o - "$component_json")"
          if [[ "$metal_status" != "installed" ]]; then
            xcodebuild -downloadComponent MetalToolchain
          fi
          xcodebuild -showComponent MetalToolchain -json > "$component_json"
          test "$(plutil -extract status raw -o - "$component_json")" = installed
          xcrun --find metal
          xcrun --find metallib

      - name: Configure
        run: >-
          cmake -S engine -B build/engine-macos-upstream
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_OSX_ARCHITECTURES=arm64
          -DGETNATIVE_ENABLE_METAL=ON
          -DGETNATIVE_ENABLE_VULKAN=OFF
          -DGETNATIVE_BUILD_UPSTREAM_CONFORMANCE=ON
          -DBUILD_TESTING=ON

      - name: Build
        run: cmake --build build/engine-macos-upstream --parallel

      - name: Test upstream descale/zimg conformance
        run: >-
          ctest --test-dir build/engine-macos-upstream --output-on-failure
          -R '^getnative_upstream_conformance_tests$'
